name: Build Prism Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (use a new version such as v0.1.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install

      - name: Build installable Windows packages
        run: npm run tauri:build -- --bundles nsis,msi

      - name: Publish installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Prism ${{ inputs.release_tag || github.ref_name }}
          target_commitish: main
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Prism for Windows
            Download **Prism_x64-setup.exe** to install Prism. The MSI package is also provided for managed installs.
            This is an early desktop preview; account sync, live voice and server-side message persistence are not yet connected.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
